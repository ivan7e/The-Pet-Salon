<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="mystyle.css">
  <title>Register a Pet | The Fashion Pet</title>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">The Fashion Pet</a>
    <nav aria-label="Primary navigation">
      <a href="index.html">Home</a>
      <a href="register.html" aria-current="page">Register</a>
    </nav>
  </header>

  <main>
    <section class="page-heading">
      <p class="eyebrow">Salon check-in</p>
      <h1>Register a New Pet</h1>
      <p>Add pets to the salon list, choose a service, and manage registrations.</p>
    </section>

    <section class="registration-layout">
      <form id="petForm" class="pet-form">
        <div class="input-container">
          <label for="txtName">Pet Name</label>
          <input type="text" id="txtName" autocomplete="off" required>
        </div>

        <div class="input-container">
          <label for="txtAge">Age</label>
          <input type="number" id="txtAge" min="0" max="40" required>
        </div>

        <div class="input-container">
          <label for="txtGender">Gender</label>
          <select id="txtGender" required>
            <option value="">Select gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Unknown">Unknown</option>
          </select>
        </div>

        <div class="input-container">
          <label for="txtBreed">Breed</label>
          <input type="text" id="txtBreed" autocomplete="off" required>
        </div>

        <div class="input-container">
          <label for="txtService">Service</label>
          <select id="txtService" required>
            <option value="">Select service</option>
            <option value="Grooming">Grooming</option>
            <option value="Dog Walking">Dog Walking</option>
            <option value="Bath and Brush">Bath and Brush</option>
            <option value="Nail Trim">Nail Trim</option>
            <option value="Spa Package">Spa Package</option>
          </select>
        </div>

        <button class="primary-button" type="submit">Register Pet</button>
        <p id="formMessage" class="form-message" aria-live="polite"></p>
      </form>

      <section class="table-card" aria-label="Registered pets">
        <div class="table-header">
          <div>
            <p class="eyebrow">Current guests</p>
            <h2>Registered Pets</h2>
          </div>
          <span id="petCount" class="pet-count">0 pets</span>
        </div>

        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Breed</th>
                <th>Service</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="results"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="./scripts/register.js"></script>
</body>
</html>
